version: 2
updates:
  # Enable Dependabot for GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Enable Dependabot for npm
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    allow:
      - dependency-type: all
    reviewers:
      - nenadpejic
    assignees:
      - nenadpejic
