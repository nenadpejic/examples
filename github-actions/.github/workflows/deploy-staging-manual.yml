name: Deploy - Staging (Manual)

# Manual deployment to staging environment
# Use this workflow when you want to deploy a specific version to staging for testing
# Triggered via GitHub UI with workflow_dispatch
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit SHA to deploy'
        required: true
        default: 'develop'
        type: string
      approval_message:
        description: 'Approval reason/notes'
        required: false
        type: string

jobs:
  # Request approval before deployment
  request-approval:
    runs-on: ubuntu-latest
    steps:
      - name: Log deployment request
        run: |
          echo "📋 Staging Deployment Request"
          echo "Ref: ${{ github.event.inputs.ref }}"
          echo "Approval message: ${{ github.event.inputs.approval_message }}"
          echo "Triggered by: ${{ github.actor }}"

  deploy-staging:
    runs-on: ubuntu-latest
    needs: request-approval
    # Environment protection: can require reviewers before deployment
    # Set up in repository settings: Settings > Environments > staging
    environment:
      name: staging
      url: https://staging-example.vercel.app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to staging environment..."
          echo "Deployment info:"
          echo "  - Ref: ${{ github.event.inputs.ref }}"
          echo "  - Commit: ${{ github.sha }}"
          echo "  - Triggered by: ${{ github.actor }}"
          if [ -n "${{ github.event.inputs.approval_message }}" ]; then
            echo "  - Reason: ${{ github.event.inputs.approval_message }}"
          fi

      - name: Comment on PR/commit with deployment info
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: '${{ github.sha }}',
              body: '✅ Successfully deployed to staging environment\n\nDeployed by: @${{ github.actor }}'
            });

      - name: Notify Slack (optional)
        if: success()
        run: echo "In a real setup, send Slack notification here"
