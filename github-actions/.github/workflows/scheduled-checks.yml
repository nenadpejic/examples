name: Scheduled - Checks

# Run comprehensive checks on a schedule
# Useful for catching issues that don't appear on regular commits
on:
  # Run every night at 2 AM UTC
  schedule:
    - cron: '0 2 * * *'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  # Full test suite
  nightly-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite
        run: npm run test:coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false

  # Dependency audit
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Audit dependencies
        run: npm audit
        continue-on-error: true

      - name: Generate audit report
        run: |
          npm audit --json > audit-report.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@v3
        with:
          name: audit-report-${{ github.run_id }}
          path: audit-report.json
          retention-days: 30

  # TypeScript type checking
  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

  # Build on multiple Node versions
  matrix-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18.x', '20.x', '22.x']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # Send summary report
  scheduled-summary:
    runs-on: ubuntu-latest
    needs: [nightly-tests, dependency-audit, type-check, matrix-build]
    if: always()
    steps:
      - name: Create summary report
        run: |
          echo "📊 Nightly Scheduled Check Summary"
          echo "=================================="
          echo ""
          echo "Tests: ${{ needs.nightly-tests.result }}"
          echo "Dependency Audit: ${{ needs.dependency-audit.result }}"
          echo "Type Check: ${{ needs.type-check.result }}"
          echo "Matrix Build: ${{ needs.matrix-build.result }}"
          echo ""
          echo "Overall Status: ${{ job.status }}"

      # Optional: Send email or Slack notification
      - name: Notify if failures
        if: failure()
        run: |
          echo "⚠️ Scheduled checks encountered issues"
          echo "Check workflow logs for details"
