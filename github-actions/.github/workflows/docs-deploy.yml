name: Documentation - Deploy

# Generate and deploy documentation to GitHub Pages
on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'src/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Generate JSDoc documentation
      - name: Generate JSDoc
        run: |
          mkdir -p docs/generated
          echo "# API Documentation" > docs/generated/api.md
          echo "" >> docs/generated/api.md
          echo "## Generated Documentation" >> docs/generated/api.md
          echo "" >> docs/generated/api.md
          echo "This documentation was auto-generated from source code." >> docs/generated/api.md

      # Build static site documentation
      - name: Create documentation site
        run: |
          mkdir -p site
          cp -r docs/* site/ 2>/dev/null || true
          cp README.md site/index.md
          
          # Create simple HTML index if markdown files exist
          ls site/*.md > /dev/null 2>&1 && \
          cat > site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>CI/CD Documentation</title>
            <style>
              body { font-family: Arial, sans-serif; max-width: 1000px; margin: 0 auto; padding: 20px; }
              h1 { color: #667eea; }
              a { color: #667eea; text-decoration: none; }
              a:hover { text-decoration: underline; }
              .nav { background: #f5f5f5; padding: 10px; border-radius: 5px; }
            </style>
          </head>
          <body>
            <h1>📖 CI/CD Documentation</h1>
            <div class="nav">
              <h2>Documentation</h2>
              <ul>
                <li><a href="GITHUB_ACTIONS_GUIDE.html">GitHub Actions Guide</a></li>
                <li><a href="WORKFLOWS_REFERENCE.html">Workflows Reference</a></li>
                <li><a href="DEPLOYMENT_STRATEGY.html">Deployment Strategy</a></li>
                <li><a href="SECURITY_PRACTICES.html">Security Practices</a></li>
                <li><a href="PERFORMANCE_OPTIMIZATION.html">Performance Optimization</a></li>
                <li><a href="TROUBLESHOOTING.html">Troubleshooting</a></li>
              </ul>
            </div>
            <p>Documentation generated on $(date -u +'%Y-%m-%d %H:%M:%S UTC')</p>
          </body>
          </html>
          EOF

      # Upload documentation artifact
      - name: Upload documentation
        uses: actions/upload-artifact@v3
        with:
          name: documentation-site
          path: site/
          retention-days: 30

      # Configure GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v3

      # Upload pages artifact
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: 'site'

  deploy-docs:
    runs-on: ubuntu-latest
    needs: build-docs
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2

      - name: Deployment summary
        run: |
          echo "✅ Documentation deployed successfully"
          echo "📄 Documentation URL: ${{ steps.deployment.outputs.page_url }}"
