name: Security - Scan

# Run security scans on push and pull requests
# Includes dependency vulnerability scanning and SAST (Static Application Security Testing)
on:
  push:
    branches:
      - main
      - develop
  pull_request:
  # Run security scans weekly to catch newly discovered vulnerabilities
  schedule:
    - cron: '0 2 * * 0' # Every Sunday at 2 AM UTC

permissions:
  # Required for CodeQL and Dependabot
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dependency scanning using GitHub's built-in Dependabot
  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # Audit dependencies for known vulnerabilities
      - name: Run npm audit
        run: |
          echo "🔍 Scanning dependencies for vulnerabilities..."
          npm audit --audit-level=moderate

      # Alternative: Use npm audit fix to automatically fix vulnerabilities
      # Uncomment in production with appropriate PR creation
      # - name: Fix vulnerabilities
      #   run: npm audit fix

  # SAST (Static Application Security Testing) using CodeQL
  # CodeQL analyzes code for security vulnerabilities and quality issues
  codeql-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Initialize CodeQL analysis
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: 'javascript'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      # Run CodeQL analysis
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        with:
          category: '/language:javascript'

  # Check for supply chain risks (package provenance)
  supply-chain-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # Check package lockfile integrity
      - name: Verify package-lock.json integrity
        run: |
          npm ci --audit
          echo "✅ Package integrity verified"

  # Report security findings
  security-report:
    runs-on: ubuntu-latest
    needs: [dependency-scan, codeql-scan, supply-chain-check]
    if: always()
    steps:
      - name: Generate security report
        run: |
          echo "📊 Security Scan Summary"
          echo "========================"
          
          if [ "${{ needs.dependency-scan.result }}" = "success" ]; then
            echo "✅ Dependency scan: PASSED"
          else
            echo "⚠️ Dependency scan: FAILED"
          fi
          
          if [ "${{ needs.codeql-scan.result }}" = "success" ]; then
            echo "✅ CodeQL scan: PASSED"
          else
            echo "⚠️ CodeQL scan: FAILED"
          fi
          
          if [ "${{ needs.supply-chain-check.result }}" = "success" ]; then
            echo "✅ Supply chain check: PASSED"
          else
            echo "⚠️ Supply chain check: FAILED"
          fi

      - name: Comment PR with security report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const dependencyScan = '${{ needs.dependency-scan.result }}';
            const codeqlScan = '${{ needs.codeql-scan.result }}';
            const supplyChain = '${{ needs.supply-chain-check.result }}';
            
            let report = '## 🔒 Security Scan Results\n\n';
            report += `- Dependency Scan: ${dependencyScan === 'success' ? '✅' : '❌'}\n`;
            report += `- CodeQL Analysis: ${codeqlScan === 'success' ? '✅' : '❌'}\n`;
            report += `- Supply Chain Check: ${supplyChain === 'success' ? '✅' : '❌'}\n`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
