name: Performance - Benchmark

# Track build and test performance over time
# Run on push and PR to establish baseline and detect regressions
on:
  push:
    branches:
      - main
      - develop
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Measure build time
      - name: Build with timing
        run: |
          echo "📊 Build Performance Benchmark"
          echo "=============================="
          
          # Record start time
          BUILD_START=$(date +%s%N)
          
          # Build
          npm run build
          
          # Record end time
          BUILD_END=$(date +%s%N)
          BUILD_TIME=$(( (BUILD_END - BUILD_START) / 1000000 ))
          
          echo "Build Time: ${BUILD_TIME}ms"
          echo "BENCHMARK_BUILD_TIME=${BUILD_TIME}" >> $GITHUB_ENV
          
          # Check dist size
          DIST_SIZE=$(du -sh dist | cut -f1)
          echo "Dist Size: $DIST_SIZE"
          echo "BENCHMARK_DIST_SIZE=$DIST_SIZE" >> $GITHUB_ENV

      # Measure test execution time
      - name: Test with timing
        run: |
          echo "🧪 Test Performance Benchmark"
          echo "============================="
          
          TEST_START=$(date +%s%N)
          npm run test 2>&1 | tee test-output.txt
          TEST_END=$(date +%s%N)
          TEST_TIME=$(( (TEST_END - TEST_START) / 1000000 ))
          
          echo "Test Time: ${TEST_TIME}ms"
          echo "BENCHMARK_TEST_TIME=${TEST_TIME}" >> $GITHUB_ENV

      # Upload benchmark results as artifact
      - name: Upload benchmark results
        uses: actions/upload-artifact@v3
        with:
          name: performance-benchmark-${{ github.sha }}
          path: |
            test-output.txt
            dist/
          retention-days: 30

      # Create benchmark data file
      - name: Create benchmark data
        run: |
          cat > benchmark.json << EOF
          {
            "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "buildTimeMs": ${{ env.BENCHMARK_BUILD_TIME }},
            "testTimeMs": ${{ env.BENCHMARK_TEST_TIME }},
            "distSize": "${{ env.BENCHMARK_DIST_SIZE }}"
          }
          EOF

      # Upload benchmark as artifact for trend analysis
      - name: Store benchmark data
        uses: actions/upload-artifact@v3
        with:
          name: benchmark-data
          path: benchmark.json
          retention-days: 90

      # Comment on PR with performance metrics
      - name: Comment PR with benchmarks
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ⚡ Performance Benchmark
              
- Build Time: ${{ env.BENCHMARK_BUILD_TIME }}ms
- Test Time: ${{ env.BENCHMARK_TEST_TIME }}ms
- Distribution Size: ${{ env.BENCHMARK_DIST_SIZE }}

📦 Benchmark artifacts are available for download (30-day retention)`
            });

      # Detect potential performance regressions
      - name: Check performance regression
        run: |
          # Thresholds (in milliseconds)
          BUILD_THRESHOLD=50000  # 50 seconds
          TEST_THRESHOLD=30000   # 30 seconds
          
          if [ ${{ env.BENCHMARK_BUILD_TIME }} -gt $BUILD_THRESHOLD ]; then
            echo "⚠️ WARNING: Build time exceeds threshold!"
            echo "Build Time: ${{ env.BENCHMARK_BUILD_TIME }}ms (threshold: ${BUILD_THRESHOLD}ms)"
          fi
          
          if [ ${{ env.BENCHMARK_TEST_TIME }} -gt $TEST_THRESHOLD ]; then
            echo "⚠️ WARNING: Test time exceeds threshold!"
            echo "Test Time: ${{ env.BENCHMARK_TEST_TIME }}ms (threshold: ${TEST_THRESHOLD}ms)"
          fi
