name: CI - Test

# Trigger on push and all pull requests
on:
  push:
    branches:
      - main
      - develop
  pull_request:

# Cancel in-progress runs when a new run is triggered on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node.js with caching for faster installs
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Run tests with Vitest
      # --coverage generates coverage reports
      # --reporter=verbose provides detailed test output
      - name: Run tests
        run: npm run test:coverage

      # Upload coverage reports for analysis
      # This allows tracking code coverage over time
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false
          verbose: true

      # Comment on PR with test results (only on pull requests)
      # This provides immediate feedback without checking the Actions tab
      - name: Comment PR with test results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const testSummary = fs.existsSync('./coverage/coverage-final.json')
              ? '✅ Tests passed with coverage report generated'
              : '⚠️ Tests completed (coverage data not available)';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🧪 Test Results\n\n${testSummary}`
            });

  # Status check that summarizes test results
  test-status:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Test status check
        run: |
          if [ "${{ needs.test.result }}" = "failure" ]; then
            echo "❌ Tests failed. Please check the test logs above."
            exit 1
          fi
          echo "✅ All tests passed"
